[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "Basic agent loop, model adapter, and core tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.scripts]
agent-cli = "agent.loop:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "state_store*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=agent --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
]

